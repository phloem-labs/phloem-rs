[package]
name = "phloem-sdk"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "The official Phloem SDK for Rust"
homepage = "https://phloem.ai/docs/sdk/"
documentation = "https://docs.rs/phloem-sdk"
readme = "README.md"
keywords = ["phloem", "telemetry", "test", "hardware", "sdk"]
categories = ["science", "embedded"]
include = ["src/**/*.rs", "tests/**/*.rs", "tests/golden/*.phlm", "examples/*.rs", "README.md", "CHANGELOG.md", "LICENSE"]

# Published as `phloem-sdk` (`phloem` is taken on crates.io); imported as
# `phloem`, as Python's `import phloem`.
[lib]
name = "phloem"

# The direct route is not in this crate (see README); its gates are inert.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("direct"))'] }

[dependencies]
anyhow = { version = "^1" }
arrow = { version = "^59" }
arrow-ipc = { version = "^59", features = ["lz4", "zstd"] }
serde = { version = "^1", features = ["derive"] }
serde_json = { version = "^1" }
sha2 = { version = "^0.10" }

[target.'cfg(unix)'.dependencies]
libc = { version = "^0.2" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "^0.61", features = ["Win32_System_Registry", "Win32_System_WindowsProgramming"] }

[dev-dependencies]
serde_json = { version = "^1", features = ["arbitrary_precision"] }
